[project]
name = "mailroom"
version = "0.1.0"
description = "Command-line tool for the Kettlebird Tea Steep Club newsletter"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[project.scripts]
mailroom = "mailroom.commands:cli"

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"
